services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plateful
      POSTGRES_USER: plateful
      POSTGRES_PASSWORD: plateful_local_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plateful -d plateful"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://plateful:plateful_local_dev@postgres:5432/plateful
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8094:80"
    depends_on:
      - backend

volumes:
  postgres_data:
